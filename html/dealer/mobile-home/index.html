<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff3600">
  <title>MACHINE IQ 딜러 모바일</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/local-fonts.css">
  <link rel="stylesheet" href="./mobile.css?v=20260824-1">
</head>
<body>
  <div class="mobile-app">
    <header class="app-header">
      <button class="header-back" type="button" data-back aria-label="이전 화면으로 이동" hidden><i data-lucide="chevron-left"></i></button>
      <div class="brand" data-header-brand><strong>Bobcat</strong><span>MACHINE IQ</span></div>
      <strong class="header-title" data-header-title hidden></strong>
      <button class="header-button" type="button" data-open-notifications aria-label="알림 열기">
        <i data-lucide="bell" aria-hidden="true"></i><b id="notification-count">2</b>
      </button>
    </header>

    <main>
      <section class="app-view is-active" data-view-panel="home" aria-labelledby="home-title">
        <div class="dashboard-heading">
          <div><p>딜러 관리자</p><h1 id="home-title">대시보드</h1></div>
          <small id="period-label"></small>
        </div>

        <label class="vehicle-search dashboard-search">
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="vehicle-search" type="search" placeholder="호기·기종·고객명 검색" autocomplete="off">
        </label>

        <section class="dashboard-kpis" aria-label="주요 업무 현황">
          <button class="dashboard-kpi is-danger" type="button" data-filter="error">
            <i data-lucide="triangle-alert" aria-hidden="true"></i><span>차량 에러</span><strong id="error-total">0</strong><small>차량·배터리 통합</small>
          </button>
          <button class="dashboard-kpi is-warning" type="button" data-filter="supply">
            <i data-lucide="refresh-cw" aria-hidden="true"></i><span>소모품 도래</span><strong id="schedule-total">0</strong><small>교체 대상</small>
          </button>
          <button class="dashboard-kpi" type="button" data-filter="maintenance">
            <i data-lucide="clipboard-check" aria-hidden="true"></i><span>정비 이력</span><strong id="maintenance-total">0</strong><small>등록 내역</small>
          </button>
        </section>

        <section class="dashboard-panel" aria-labelledby="work-summary-title">
          <div class="dashboard-panel__head"><h2 id="work-summary-title">업무 구성</h2><span id="service-total">총 0건</span></div>
          <div class="dashboard-distribution">
            <div class="dashboard-donut" id="service-donut"><span>전체 업무<strong id="service-donut-total">0</strong></span></div>
            <div class="dashboard-legend">
              <button type="button" data-filter="error"><i class="is-error"></i><span>차량 에러</span><strong id="legend-error-total">0</strong></button>
              <button type="button" data-filter="supply"><i class="is-supply"></i><span>소모품 도래</span><strong id="legend-supply-total">0</strong></button>
            </div>
          </div>
        </section>

        <section class="dashboard-panel dashboard-recent">
          <div class="dashboard-panel__head"><h2>최근 알림</h2><span id="priority-count">0건</span></div>
          <div class="dashboard-alert-list" id="priority-list"></div>
          <p class="empty-state" id="empty-state" hidden>검색 결과가 없습니다.</p>
        </section>
      </section>

      <section class="app-view sub-view" data-view-panel="vehicles" data-title="차량" aria-labelledby="vehicles-title">
        <div class="sub-head"><div><h1 id="vehicles-title">차량</h1><p>고객사 보유 차량과 상태를 확인합니다.</p></div><span id="vehicle-total"></span></div>
        <label class="vehicle-search sub-search"><i data-lucide="search"></i><input id="vehicle-list-search" type="search" placeholder="호기·기종·고객명 검색" autocomplete="off"></label>
        <div class="filter-chips" aria-label="차량 상태 필터"><button class="is-active" type="button" data-vehicle-filter="all">전체</button><button type="button" data-vehicle-filter="attention">확인 필요</button><button type="button" data-vehicle-filter="normal">정상</button></div>
        <div class="vehicle-mobile-list" id="vehicle-mobile-list"></div>
        <p class="empty-state" id="vehicle-empty" hidden>검색 결과가 없습니다.</p>
      </section>

      <section class="app-view sub-view" data-view-panel="service" data-title="서비스" aria-labelledby="service-title">
        <div class="sub-head"><div><h1 id="service-title">서비스</h1><p>차량 에러·소모품·정비 상태를 한곳에서 확인합니다.</p></div></div>
        <div class="service-counts" role="tablist" aria-label="서비스 현황"><button class="is-active" type="button" role="tab" aria-selected="true" data-service-type="error"><i data-lucide="triangle-alert"></i><span>차량 에러</span><strong id="service-error-count"></strong></button><button type="button" role="tab" aria-selected="false" data-service-type="supply"><i data-lucide="wrench"></i><span>소모품</span><strong id="service-supply-count"></strong></button><button type="button" role="tab" aria-selected="false" data-service-type="maintenance"><i data-lucide="clipboard-check"></i><span>정비</span><strong id="service-maintenance-count"></strong></button></div>
        <div class="service-mobile-list" id="service-mobile-list"></div>
      </section>

      <section class="app-view sub-view detail-view" data-view-panel="vehicle-detail" data-title="차량 상세" aria-labelledby="vehicle-detail-title">
        <div class="detail-hero">
          <div class="detail-icon"><i data-lucide="truck"></i></div>
          <div><small id="vehicle-detail-model"></small><h1 id="vehicle-detail-title"></h1><p id="vehicle-detail-company"></p></div>
          <span class="status-pill" id="vehicle-detail-status"></span>
        </div>
        <section class="detail-card">
          <h2>기본 정보</h2>
          <dl class="detail-definition" id="vehicle-detail-info"></dl>
        </section>
        <section class="detail-card">
          <div class="detail-card__head"><h2>서비스 현황</h2><span id="vehicle-service-total"></span></div>
          <div class="detail-service-list" id="vehicle-service-list"></div>
          <p class="empty-state compact" id="vehicle-service-empty" hidden>등록된 서비스 내역이 없습니다.</p>
        </section>
      </section>

      <section class="app-view sub-view detail-view" data-view-panel="service-detail" data-title="서비스 상세" aria-labelledby="service-detail-title">
        <div class="detail-hero service-detail-hero">
          <div class="detail-icon" id="service-detail-icon"><i data-lucide="triangle-alert"></i></div>
          <div><small id="service-detail-type"></small><h1 id="service-detail-title"></h1><p id="service-detail-equipment"></p></div>
          <span class="status-pill" id="service-detail-status"></span>
        </div>
        <section class="detail-card">
          <h2>상세 정보</h2>
          <dl class="detail-definition" id="service-detail-info"></dl>
        </section>
        <button class="detail-primary-button" type="button" id="service-detail-vehicle"><i data-lucide="truck"></i>차량 상세 보기</button>
      </section>

      <section class="app-view" data-view-panel="settings" aria-labelledby="settings-title">
        <div class="settings-head"><h1 id="settings-title">설정</h1><p>계정과 알림 수신 방식을 관리합니다.</p></div>

        <section class="settings-card account-card">
          <div class="account-avatar">관</div>
          <div><span>로그인 계정</span><strong id="account-id"></strong><small>딜러 관리자 · 로그인됨</small></div>
        </section>

        <section class="settings-group">
          <h2>알림</h2>
          <label class="setting-row"><span><strong>차량 에러</strong><small>새 차량·배터리 에러 알림</small></span><input type="checkbox" data-setting="vehicleError" checked><i></i></label>
          <label class="setting-row"><span><strong>소모품 도래</strong><small>교체 기준 도달 및 초과 알림</small></span><input type="checkbox" data-setting="supplies" checked><i></i></label>
          <label class="setting-row"><span><strong>정비 상태</strong><small>정비 접수 및 완료 알림</small></span><input type="checkbox" data-setting="maintenance" checked><i></i></label>
          <label class="setting-row"><span><strong>로그인 보안</strong><small>새 기기 로그인 알림</small></span><input type="checkbox" data-setting="loginSecurity" checked><i></i></label>
        </section>

        <section class="settings-group">
          <h2>앱 설정</h2>
          <label class="select-row"><span><strong>언어</strong><small>화면 표시 언어</small></span><select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
        </section>

        <button class="logout-button" type="button" id="logout">로그아웃</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button type="button" class="is-active" data-nav="home"><i data-lucide="house"></i><span>홈</span></button>
      <button type="button" data-nav="vehicles"><i data-lucide="truck"></i><span>차량</span></button>
      <button type="button" data-nav="service"><i data-lucide="wrench"></i><span>서비스</span></button>
      <button type="button" data-nav="settings"><i data-lucide="settings"></i><span>설정</span></button>
    </nav>
  </div>

  <div class="sheet-backdrop" data-close-sheet hidden></div>
  <aside class="notification-sheet" aria-labelledby="notification-title" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2 id="notification-title">알림</h2><button type="button" data-close-sheet aria-label="알림 닫기">×</button></div>
    <div id="notification-list"></div>
  </aside>
  <div class="toast" role="status" aria-live="polite" hidden></div>

  <script src="./layouts/vendor/lucide.min.js"></script>
  <script src="./data.js"></script>
  <script src="./mobile.js"></script>
</body>
</html>
