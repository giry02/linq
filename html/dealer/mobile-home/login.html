<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>MACHINE IQ 딜러 모바일 로그인</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/local-fonts.css">
  <link rel="stylesheet" href="./login.css?v=20260824-2">
</head>
<body>
  <main class="login-page">
    <header class="login-brand" aria-label="Bobcat MACHINE IQ">
      <img class="login-brand__logo" src="./bobcat-machine-iq.svg" alt="Bobcat MACHINE IQ">
    </header>

    <section class="login-card" aria-labelledby="login-title">
      <div class="login-card__top">
        <div class="language-control"><i data-lucide="languages" aria-hidden="true"></i><label class="sr-only" for="login-language">언어 선택</label><select id="login-language"><option value="ko">한국어</option><option value="en">English</option></select></div>
        <h1 id="login-title">로그인</h1>
      </div>

      <form id="mobile-login-form">
        <label class="login-field"><span>아이디</span><input id="login-id" name="userId" type="text" value="Test_Dealer2_Admin" autocomplete="username" required></label>
        <label class="login-field"><span>비밀번호</span><span class="password-input"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" required><button type="button" id="password-toggle" aria-label="비밀번호 표시"><i data-lucide="eye"></i></button></span></label>
        <label class="save-id"><input id="save-id" type="checkbox" checked><span>아이디 저장</span></label>

        <div class="login-actions">
          <button class="login-submit" type="submit">로그인</button>
        </div>
      </form>

      <p class="security-copy">본 사이트는 인가된 사용자만 사용할 수 있으며, 사용자 접속 모니터링 및 로그 기록을 하고 있습니다.</p>
      <nav class="login-terms" aria-label="약관 및 정책"><button type="button" data-demo-action="이용약관">이용약관</button><i></i><button type="button" data-demo-action="위치정보 및 위치기반서비스 이용약관">위치정보 및 위치기반서비스 이용약관</button><i></i><button type="button" data-demo-action="개인(위치)정보 처리방침">개인(위치)정보 처리방침</button></nav>
    </section>

    <footer class="login-footer">©2024 Bobcat Company. ALL RIGHTS RESERVED.</footer>
  </main>
  <div class="login-toast" role="status" aria-live="polite" hidden></div>
  <script src="./layouts/vendor/lucide.min.js"></script>
  <script src="./login.js?v=20260824-2"></script>
</body>
</html>
