<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff3600">
  <title>MACHINE IQ 딜러 모바일 · 간략 조치형</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/local-fonts.css">
  <link rel="stylesheet" href="./mobile.css?v=20260824-6">
  <link rel="stylesheet" href="./home-variants.css?v=20260824-1">
</head>
<body data-home-variant="compact">
  <div class="mobile-app">
    <header class="app-header">
      <div class="brand"><strong>Bobcat</strong><span>MACHINE IQ</span></div>
      <button class="header-button" type="button" data-open-current aria-label="알림 열기"><i data-lucide="bell"></i><b data-notification-count>0</b></button>
    </header>
    <main>
      <section class="app-view is-active variant-home compact-home" aria-labelledby="compact-home-title">
        <h1 class="sr-only" id="compact-home-title">간략 조치형 홈</h1>
        <div class="dashboard-period compact-period">
          <div><strong>조회 기간</strong><small data-period-label></small></div>
          <div class="period-tabs" role="group" aria-label="조회 기간"><button type="button" data-period="day">금일</button><button type="button" data-period="week">주</button><button class="is-active" type="button" data-period="month">월</button></div>
        </div>
        <section class="compact-summary" aria-label="조치 현황">
          <button class="is-error" type="button" data-open-current><i data-lucide="triangle-alert"></i><span>에러<strong data-error-total>0</strong></span></button>
          <button class="is-supply" type="button" data-open-current><i data-lucide="wrench"></i><span>소모품<strong data-supply-total>0</strong></span></button>
          <button class="is-done" type="button" data-open-current><i data-lucide="clipboard-check"></i><span>처리완료<strong data-maintenance-total>0</strong></span></button>
        </section>
        <section class="variant-panel compact-action-panel">
          <header><div><h2>오늘의 우선 조치</h2><p>문제가 있는 차량부터 확인합니다.</p></div><span data-priority-total>0건</span></header>
          <div class="compact-action-list" data-compact-action-list></div>
        </section>
        <section class="variant-panel compact-vehicle-panel">
          <header><div><h2>관리 차량</h2><p>전체 차량 상태를 빠르게 확인합니다.</p></div><button type="button" data-open-current>차량보기<i data-lucide="chevron-right"></i></button></header>
          <div class="compact-vehicle-summary"><span>전체<strong data-vehicle-total>0</strong></span><span class="is-attention">확인 필요<strong data-vehicle-attention>0</strong></span><span class="is-normal">정상<strong data-vehicle-normal>0</strong></span></div>
        </section>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="주 메뉴">
      <button type="button" class="is-active"><i data-lucide="house"></i><span>홈</span></button><button type="button" data-open-current><i data-lucide="truck"></i><span>차량</span></button><button type="button" data-open-current><i data-lucide="triangle-alert"></i><span>에러</span></button><button type="button" data-open-current><i data-lucide="wrench"></i><span>소모품</span></button><button type="button" data-open-current><i data-lucide="settings"></i><span>설정</span></button>
    </nav>
  </div>
  <script src="./layouts/vendor/lucide.min.js"></script>
  <script src="./data.js?v=20260824-6"></script>
  <script src="./home-variants.js?v=20260824-1"></script>
</body>
</html>
