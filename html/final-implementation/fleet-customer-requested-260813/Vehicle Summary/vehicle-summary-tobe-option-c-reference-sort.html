<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>운행이력 - 요약정보 C안 · 원형 유지 정렬형</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap"/>
<link rel="stylesheet" href="../_shared/gnb.css"/>
<link rel="stylesheet" href="../_shared/content-system.css?v=20260902-readability"/>
<link rel="stylesheet" href="../_shared/vehicle-summary-option-c.css?v=20260902-4"/>
</head>
<body class="miq-content-system miq-content-summary miq-summary-option-c" data-summary-option="source-sort" data-gnb="anlz" data-sub="summary" data-variant="tobe" data-base="../">

<div id="gnb"></div>

<div class="layout">
  <aside class="lnb" id="lnb"></aside>

  <main class="main">
    <div class="summary-content miq-content-frame">
      <header class="summary-titlebar">
        <div class="summary-heading">
          <h1 class="miq-page-title">요약정보</h1>
          <span class="concept-badge">C안 · 원형 유지 정렬형</span>
          <span class="miq-page-scope" id="scopeTitle">- 전체</span>
        </div>
        <div class="filter-bar">
          <div class="period-tabs" id="periodTabs" role="group" aria-label="조회 기간 단위">
            <button type="button" data-period="d">일</button>
            <button type="button" data-period="w">주</button>
            <button type="button" class="active" data-period="m">월</button>
            <button type="button" data-period="c">사용자설정</button>
          </div>
          <div class="date-range" id="dateRange">
            <input type="date" value="2026-07-01" disabled aria-label="조회 시작일"/>
            <span>~</span>
            <input type="date" value="2026-07-31" disabled aria-label="조회 종료일"/>
          </div>
          <button type="button" class="btn-search miq-button miq-button--primary" id="runSearch">조회</button>
        </div>
      </header>

      <section class="c-summary-table" id="summaryTable" aria-label="운행 요약 지표"></section>
      <section class="c-reference-list" aria-label="차량별 운행정보">
        <div class="c-list-head" id="referenceToolbar"></div>
        <div class="c-card-list" id="referenceCards"></div>
      </section>
      <p class="c-data-note">운영률과 TMS Serial은 현재 고객 차량 명부에 원천값이 없어 임의로 생성하지 않고 ‘정보 미제공’으로 표시합니다.</p>
      <div class="c-live" id="referenceLive" aria-live="polite"></div>
    </div>
  </main>
</div>

<script src="../_shared/nav.js"></script>
<script src="../_shared/fleet.js"></script>
<script src="../_shared/lnb-tree.js"></script>
<script src="../_shared/vehicle-summary-option-c.js?v=20260902-4"></script>
</body>
</html>
