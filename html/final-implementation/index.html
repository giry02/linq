<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MACHINE IQ 완료 작업본</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#171717;font-family:"Noto Sans KR",Arial,sans-serif}main{width:min(1060px,calc(100% - 40px));margin:0 auto;padding:64px 0}header{padding-bottom:28px;border-bottom:2px solid #171717}small{color:#ff3600;font-weight:800;letter-spacing:.08em}h1{margin:10px 0 8px;font-size:34px}header p{margin:0;color:#666}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}.card{padding:26px;border:1px solid #ddd;border-radius:12px;background:#fff}.card h2{margin:0 0 8px;font-size:24px}.card p{min-height:44px;margin:0 0 22px;color:#666;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 17px;border:1px solid #ff3600;border-radius:5px;color:#ff3600;text-decoration:none;font-weight:700}.actions a.primary{color:#fff;background:#ff3600}.notice{margin-top:18px;padding:18px 20px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#555;line-height:1.6}@media(max-width:720px){main{padding-top:34px}.cards{grid-template-columns:1fr}h1{font-size:28px}}
  </style>
</head>
<body>
  <main>
    <header>
      <small>FINAL IMPLEMENTATION</small>
      <h1>MACHINE IQ 완료 작업본</h1>
      <p>기존 API·에셋을 유지한 플릿·딜러 복사본입니다. 요구사항 적용 화면은 현재 확정본과 동일하게 유지합니다.</p>
    </header>
    <section class="cards">
      <article class="card">
        <h2>플릿</h2>
        <p>플릿 데이터와 실제 메뉴 구조를 사용하는 완료 작업본</p>
        <div class="actions"><a class="primary" href="./fleet/">플릿 열기</a><a href="./fleet/public-dashboard.html">정적 미리보기</a></div>
      </article>
      <article class="card">
        <h2>딜러</h2>
        <p>딜러 데이터와 실제 메뉴 구조를 사용하는 완료 작업본</p>
        <div class="actions"><a class="primary" href="./dealer/">딜러 열기</a><a href="./dealer/mobile-home/">모바일 웹</a></div>
      </article>
    </section>
    <div class="notice">실제 SPA와 로컬 JSON API는 각 폴더의 <strong>server.mjs</strong>로 실행합니다. 빨간 번호와 요구사항 설명 패널은 완료본에서 제외했습니다.</div>
  </main>
</body>
</html>
