<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MACHINE IQ 요구사항 회의 질의서</title>
  <style>
    :root {
      font-family: "Noto Sans KR", "Pretendard", "Malgun Gothic", sans-serif;
      color: #121212;
      background: #f3f4f6;
      --orange: #ff3600;
      --ink: #121212;
      --muted: #69717d;
      --line: #dfe2e6;
      --panel: #fff;
      --soft: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select { font: inherit; }
    .topbar {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 38px;
      color: #fff;
      background: var(--orange);
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 235px; max-height: 39px; object-fit: contain; object-position: left center; }
    .brand span { padding-left: 16px; border-left: 1px solid rgba(255,255,255,.5); font-size: 15px; font-weight: 800; }
    .topbar a { color: #fff; text-decoration: none; font-weight: 700; }
    main { width: min(1280px, calc(100% - 48px)); margin: 0 auto; padding: 54px 0 80px; }
    .hero { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 30px; align-items: end; padding-bottom: 30px; border-bottom: 2px solid #161616; }
    .eyebrow { margin: 0 0 12px; color: var(--orange); font-size: 13px; font-weight: 900; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(34px, 4vw, 54px); letter-spacing: -.06em; line-height: 1.15; }
    .lead { max-width: 820px; margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.75; }
    .summary { display: grid; grid-template-columns: repeat(3, 108px); gap: 10px; }
    .summary div { padding: 17px 10px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .summary b { display: block; font-size: 24px; }
    .summary span { color: var(--muted); font-size: 12px; }
    .tools { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: minmax(260px,1fr) 190px 190px; gap: 10px; margin: 24px 0; padding: 14px; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(20,22,27,.07); backdrop-filter: blur(8px); }
    .tools input, .tools select { height: 44px; padding: 0 14px; background: #fff; border: 1px solid #cfd3d8; border-radius: 7px; }
    .results { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .group { margin: 0 0 28px; }
    .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .group-head h2 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
    .group-head span { color: var(--muted); font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .card { position: relative; padding: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 5px 16px rgba(20,22,27,.04); }
    .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--orange); border-radius: 12px 0 0 12px; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 13px; }
    .id { color: var(--orange); font-weight: 900; }
    .pill { padding: 4px 8px; color: #4f5762; background: #f0f2f4; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .card h3 { margin: 0 0 15px; font-size: 19px; line-height: 1.4; letter-spacing: -.03em; }
    .field { display: grid; grid-template-columns: 82px minmax(0,1fr); gap: 12px; padding: 10px 0; border-top: 1px solid #eceef1; }
    .field b { font-size: 13px; }
    .field p { margin: 0; color: #3f4650; font-size: 14px; line-height: 1.65; }
    .question { margin-top: 14px; padding: 16px; background: #fff5f2; border: 1px solid #ffd0c3; border-radius: 8px; }
    .question-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .question-head b { color: #b52a05; font-size: 13px; }
    .question-head span { font-size: 12px; color: #8a4a38; }
    .question p { margin: 0; font-size: 14px; line-height: 1.65; }
    .empty { padding: 80px 20px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
    .source-note { margin-top: 34px; padding: 18px 20px; color: #555d68; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; line-height: 1.7; }
    @media (max-width: 900px) {
      .topbar { padding: 0 20px; }
      .brand img { width: 190px; }
      .brand span { display: none; }
      main { width: min(100% - 28px, 720px); padding-top: 34px; }
      .hero { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .tools { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../../dealer/mobile-home/bobcat-machine-iq.svg" alt="Bobcat MACHINE IQ"><span>요구사항 회의 질의서</span></div>
    <a href="../../../index.html">산출물 목록</a>
  </header>
  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">SERVICE WORKSHOP · REQUIREMENTS & QUESTIONS</p>
        <h1>메뉴·화면별 요구사항과<br>확인 질의</h1>
        <p class="lead">PPT 원문 요구사항을 빠짐없이 표시하고, 구현 전에 결정이 필요한 항목에만 질의를 연결했습니다. 질의가 없는 요구사항에는 별도 질문을 만들지 않았습니다.</p>
      </div>
      <div class="summary" aria-label="문서 요약">
        <div><b id="total-count">31</b><span>요구사항</span></div>
        <div><b id="question-count">23</b><span>확인 질의</span></div>
        <div><b id="screen-count">0</b><span>화면·메뉴</span></div>
      </div>
    </section>

    <section class="tools" aria-label="요구사항 검색 및 필터">
      <input id="search" type="search" placeholder="요구사항 ID, 메뉴, 원문, 질의 검색">
      <select id="service-filter"><option value="">전체 서비스</option></select>
      <select id="question-filter">
        <option value="">전체 항목</option>
        <option value="yes">질의 있음</option>
        <option value="no">질의 없음</option>
      </select>
    </section>
    <p id="results" class="results" aria-live="polite"></p>
    <div id="content"></div>
    <p class="source-note"><b>출처 기준</b><br>고객 제공 파일 <b>260624_Service workshop #1_MVP.pptx</b> 2~11페이지. 요구사항 ID는 회의와 화면 검토를 연결하기 위한 관리용 식별자입니다.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
